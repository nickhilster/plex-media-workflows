version: '3.8'

services:
  # Tautulli - Plex monitoring and analytics
  tautulli:
    image: tautulli/tautulli:latest
    container_name: plex-tautulli
    ports:
      - "8181:8181"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ./tautulli/config:/config
      - ./tautulli/logs:/logs
    restart: unless-stopped
    networks:
      - plex-network

  # Radarr - Movie tracking/search only (no indexers or download client configured)
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: plex-radarr
    ports:
      - "7878:7878"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ./radarr/config:/config
      - ./radarr/wanted:/movies
    restart: unless-stopped
    networks:
      - plex-network

  # NostalgiaTV - linear channel scheduler and IPTV/EPG server
  nostalgia:
    image: purestream711/nostalgiatv-server:latest
    container_name: nostalgiatv-server
    ports:
      - "80:19850"
      - "19850:19850"
    environment:
      - TZ=America/Toronto
      - PUID=1000
      - PGID=1000
      - HDHR_ENABLED=true
      - SCHEDULE_HOURS=720
      - SCHEDULE_REFRESH_INTERVAL=21600
      - PLEX_CONTENT_POLL_INTERVAL_SECONDS=300
    volumes:
      - ./nostalgia/data:/app/data
      - ./nostalgia/config:/app/config
      - ./nostalgia/logos:/app/logos
    restart: unless-stopped
    networks:
      - plex-network

networks:
  plex-network:
    driver: bridge
