version: '3.8'

services:
  # Tautulli - Plex monitoring and analytics
  tautulli:
    image: tautulli/tautulli:latest
    container_name: plex-tautulli
    ports:
      - "8181:8181"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ./tautulli/config:/config
      - ./tautulli/logs:/logs
    restart: unless-stopped
    networks:
      - plex-network

networks:
  plex-network:
    driver: bridge
